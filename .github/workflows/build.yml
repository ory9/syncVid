name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1   # AGP 8.9.2 needs >= 8.11.1; no wrapper is committed
      - name: Unit tests + debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --console=plain --stacktrace \
            -Psynclyrics.backendUrl="${{ vars.BACKEND_URL }}" \
            -Psynclyrics.apiKey="${{ secrets.BACKEND_API_KEY }}" 2>&1 | tee build.log
      - name: Show compile errors only
        if: failure()
        run: |
          echo "=== COMPILE ERRORS (paste these) ==="
          grep -E '^(e|w): .*(error|\.kt)|^e: ' build.log | grep -E '^e: ' | head -60 || true
          { echo '### Compile errors'; echo '```'; grep -E '^e: ' build.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: synclyrics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
