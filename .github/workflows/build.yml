name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1   # AGP 8.9.2 needs >= 8.11.1; no wrapper is committed
      - name: Unit tests + debug APK
        run: >
          gradle testDebugUnitTest assembleDebug --stacktrace
          -Psynclyrics.backendUrl="${{ vars.BACKEND_URL }}"
          -Psynclyrics.apiKey="${{ secrets.BACKEND_API_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: synclyrics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
