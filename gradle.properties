# Memory-tuned for constrained hosts and standard GitHub Actions runners.
# Limit parallel worker processes to avoid memory spikes in D8/R8/AAPT2.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
# Run Kotlin compiler inside the Gradle JVM instead of a separate daemon (avoids a second heap).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
kotlin.code.style=official
