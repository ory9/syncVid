# Memory-tuned for constrained hosts (GitHub Codespaces 2-4 cores / 8 GB, CI runners).
# Worker failures ("DefaultWorkerExecutor.lambda$submitWork$0") are almost always OOM in D8/R8/AAPT2/Kotlin workers.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
# Run Kotlin compiler inside the Gradle JVM instead of a separate daemon (avoids a second heap).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
kotlin.code.style=official
